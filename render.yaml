databases:
  - name: booking_hai_db
  - name: booking-hai-db
    databaseName: booking_hai
    user: booking_hai_user

services:
  - type: web
    name: booking-hai-web
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn -c gunicorn.conf.py booking_project.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: booking-hai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: booking-hai-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"

  - type: worker
    name: booking-hai-celery
    env: python
    buildCommand: "./build.sh"
    startCommand: "celery -A booking_project worker -l INFO --concurrency=4"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: booking-hai-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: booking-hai-redis
          property: connectionString

  - type: redis
    name: booking-hai-redis
    ipAllowList: []
