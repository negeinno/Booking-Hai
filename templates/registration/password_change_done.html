{% extends "base.html" %}

{% block title %}Password Changed - Booking Hai{% endblock %}

{% block content %}
<div class="container section-padding py-5">
    <div class="row">
        <div class="col-lg-3 mb-4">
            <!-- Sidebar -->
            <div class="list-group list-group-flush rounded-4 shadow-sm border overflow-hidden sticky-top" style="top: 100px;">
                <a href="{% url 'accounts:dashboard' %}" class="list-group-item list-group-item-action py-3 fw-medium">
                    <i class="bi bi-grid me-2"></i> Dashboard
                </a>
                <a href="{% url 'accounts:profile' %}" class="list-group-item list-group-item-action py-3 fw-medium">
                    <i class="bi bi-person me-2"></i> Profile
                </a>
                <a href="{% url 'password_change' %}" class="list-group-item list-group-item-action py-3 fw-medium active">
                    <i class="bi bi-shield-lock me-2"></i> Security
                </a>
            </div>
        </div>
        
        <div class="col-lg-9">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 mb-4 text-center">
                <div class="rounded-circle bg-success-subtle text-success d-inline-flex align-items-center justify-content-center mb-4 mx-auto" style="width: 80px; height: 80px;">
                    <i class="bi bi-check-lg fs-1"></i>
                </div>
                <h4 class="fw-bold mb-3">Password Changed</h4>
                <p class="text-muted mb-4">Your password has been successfully changed.</p>
                <div>
                    <a href="{% url 'accounts:dashboard' %}" class="btn btn-primary fw-bold px-4 py-2">Return to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
